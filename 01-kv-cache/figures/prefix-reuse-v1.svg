<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260" role="img">
<title>Prefix reuse in a KV cache</title>
<desc>A prompt of 30 tokens. Request 1 computes all 30. Request 2 changes token 2, so only token 1 is reused and 29 are recomputed, and the time-to-first-token bar is long. Request 3 changes token 30, so 29 are reused, 1 is recomputed, and the bar is short. The changed token then sweeps from left to right and the bar shrinks with it. Conclusion: put what changes last. Toy model with one attention head.</desc>
<style>
  .bg{fill:#FAFAFA} .ink{fill:#17171A} .mut{fill:#71717A}
  .blk{fill:#8A8A93} .acc{fill:#7C3AED} .accs{fill:#7C3AED;fill-opacity:.42}
  .trk{fill:#E4E4E7} .cov{fill:#FAFAFA}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .a{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
  .r{transform-box:fill-box;transform-origin:right center}
  .l{transform-box:fill-box;transform-origin:left center}
  #cover{animation-name:wipe} #over{animation-name:over} #mark{animation-name:mark}
  #ttft{animation-name:ttft}
  #t1{animation-name:t1} #t2{animation-name:t2} #t3{animation-name:t3} #t4{animation-name:t4} #t5{animation-name:t5} #c1{animation-name:c1} #c2{animation-name:c2} #c3{animation-name:c3} #c4{animation-name:c4} #c5{animation-name:c5}
  @keyframes wipe { 0% { transform:scaleX(1) } 11.5% { transform:scaleX(0) } 100% { transform:scaleX(0) } } @keyframes over { 0% { transform:scaleX(1) } 12.5% { transform:scaleX(1) } 14.5% { transform:scaleX(0.9665) } 31.25% { transform:scaleX(0.9665) } 33.25% { transform:scaleX(0.0287) } 50.0% { transform:scaleX(0.0287) } 52.0% { transform:scaleX(1.0000) } 81.25% { transform:scaleX(0.0287) } 100% { transform:scaleX(0.0287) } } @keyframes mark { 0% { opacity:0;transform:translateX(0px) } 12.5% { opacity:0;transform:translateX(14px) } 14.5% { opacity:1;transform:translateX(14px) } 31.25% { opacity:1;transform:translateX(14px) } 33.25% { opacity:1;transform:translateX(406px) } 50.0% { opacity:1;transform:translateX(406px) } 52.0% { opacity:1;transform:translateX(0px) } 81.25% { opacity:1;transform:translateX(406px) } 100% { opacity:1;transform:translateX(406px) } } @keyframes ttft { 0% { transform:scaleX(0) } 11.5% { transform:scaleX(1) } 12.5% { transform:scaleX(1) } 14.5% { transform:scaleX(0.9667) } 31.25% { transform:scaleX(0.9667) } 33.25% { transform:scaleX(0.0333) } 50.0% { transform:scaleX(0.0333) } 52.0% { transform:scaleX(1) } 81.25% { transform:scaleX(0.0333) } 100% { transform:scaleX(0.0333) } } @keyframes t1 { 0% { opacity:1 } 12.5% { opacity:1 } 14.0% { opacity:0 } 100% { opacity:0 } } @keyframes t2 { 0% { opacity:0 } 11.0% { opacity:0 } 12.5% { opacity:1 } 31.25% { opacity:1 } 32.75% { opacity:0 } 100% { opacity:0 } } @keyframes t3 { 0% { opacity:0 } 29.75% { opacity:0 } 31.25% { opacity:1 } 50.0% { opacity:1 } 51.5% { opacity:0 } 100% { opacity:0 } } @keyframes t4 { 0% { opacity:0 } 48.5% { opacity:0 } 50.0% { opacity:1 } 81.25% { opacity:1 } 82.75% { opacity:0 } 100% { opacity:0 } } @keyframes t5 { 0% { opacity:0 } 79.75% { opacity:0 } 81.25% { opacity:1 } 100% { opacity:1 } 100% { opacity:1 } } @keyframes c1 { 0% { opacity:1 } 12.5% { opacity:1 } 14.0% { opacity:0 } 100% { opacity:0 } } @keyframes c2 { 0% { opacity:0 } 11.0% { opacity:0 } 12.5% { opacity:1 } 31.25% { opacity:1 } 32.75% { opacity:0 } 100% { opacity:0 } } @keyframes c3 { 0% { opacity:0 } 29.75% { opacity:0 } 31.25% { opacity:1 } 50.0% { opacity:1 } 51.5% { opacity:0 } 100% { opacity:0 } } @keyframes c4 { 0% { opacity:0 } 48.5% { opacity:0 } 50.0% { opacity:1 } 81.25% { opacity:1 } 82.75% { opacity:0 } 100% { opacity:0 } } @keyframes c5 { 0% { opacity:0 } 79.75% { opacity:0 } 81.25% { opacity:1 } 100% { opacity:1 } 100% { opacity:1 } }
  @media (prefers-color-scheme: dark) {
    .bg,.cov{fill:#18181B} .ink{fill:#F4F4F5} .mut{fill:#A1A1AA}
    .blk{fill:#71717A} .acc{fill:#9061F9} .accs{fill:#9061F9;fill-opacity:.38} .trk{fill:#3F3F46}
  }
  @media (prefers-reduced-motion: reduce) { .a{animation:none} }
</style>
<rect class="bg" width="460" height="260"/>
<text id="t1" class="a ink" x="20" y="28" font-size="15" font-weight="600" opacity="0">Request 1: empty cache</text><text id="t2" class="a ink" x="20" y="28" font-size="15" font-weight="600" opacity="0">Request 2: token 2 changed</text><text id="t3" class="a ink" x="20" y="28" font-size="15" font-weight="600" opacity="0">Request 3: token 30 changed</text><text id="t4" class="a ink" x="20" y="28" font-size="15" font-weight="600" opacity="0">Moving the changed token right</text><text id="t5" class="a ink" x="20" y="28" font-size="15" font-weight="600" opacity="1">Put what changes last</text><text id="c1" class="a ink" x="20" y="214" font-size="14" font-weight="400" opacity="0">computed 30</text><text id="c2" class="a ink" x="20" y="214" font-size="14" font-weight="400" opacity="0">reused 1 · recomputed 29</text><text id="c3" class="a ink" x="20" y="214" font-size="14" font-weight="400" opacity="0">reused 29 · recomputed 1</text><text id="c4" class="a ink" x="20" y="214" font-size="14" font-weight="400" opacity="0">recomputed = tokens after the change</text><text id="c5" class="a ink" x="20" y="214" font-size="14" font-weight="400" opacity="1">reused 29 · recomputed 1</text>
<text class="mut" x="20" y="50" font-size="13">30 prompt tokens, one attention head</text>
<rect class="blk" x="20" y="70" width="12" height="30" rx="2"/><rect class="blk" x="34" y="70" width="12" height="30" rx="2"/><rect class="blk" x="48" y="70" width="12" height="30" rx="2"/><rect class="blk" x="62" y="70" width="12" height="30" rx="2"/><rect class="blk" x="76" y="70" width="12" height="30" rx="2"/><rect class="blk" x="90" y="70" width="12" height="30" rx="2"/><rect class="blk" x="104" y="70" width="12" height="30" rx="2"/><rect class="blk" x="118" y="70" width="12" height="30" rx="2"/><rect class="blk" x="132" y="70" width="12" height="30" rx="2"/><rect class="blk" x="146" y="70" width="12" height="30" rx="2"/><rect class="blk" x="160" y="70" width="12" height="30" rx="2"/><rect class="blk" x="174" y="70" width="12" height="30" rx="2"/><rect class="blk" x="188" y="70" width="12" height="30" rx="2"/><rect class="blk" x="202" y="70" width="12" height="30" rx="2"/><rect class="blk" x="216" y="70" width="12" height="30" rx="2"/><rect class="blk" x="230" y="70" width="12" height="30" rx="2"/><rect class="blk" x="244" y="70" width="12" height="30" rx="2"/><rect class="blk" x="258" y="70" width="12" height="30" rx="2"/><rect class="blk" x="272" y="70" width="12" height="30" rx="2"/><rect class="blk" x="286" y="70" width="12" height="30" rx="2"/><rect class="blk" x="300" y="70" width="12" height="30" rx="2"/><rect class="blk" x="314" y="70" width="12" height="30" rx="2"/><rect class="blk" x="328" y="70" width="12" height="30" rx="2"/><rect class="blk" x="342" y="70" width="12" height="30" rx="2"/><rect class="blk" x="356" y="70" width="12" height="30" rx="2"/><rect class="blk" x="370" y="70" width="12" height="30" rx="2"/><rect class="blk" x="384" y="70" width="12" height="30" rx="2"/><rect class="blk" x="398" y="70" width="12" height="30" rx="2"/><rect class="blk" x="412" y="70" width="12" height="30" rx="2"/><rect class="blk" x="426" y="70" width="12" height="30" rx="2"/>
<rect id="over" class="a r accs" x="20" y="70" width="418" height="30" rx="2" style="transform:scaleX(0.0287)"/>
<rect id="mark" class="a acc" x="20" y="70" width="12" height="30" rx="2" style="transform:translateX(406px)"/>
<rect id="cover" class="a r cov" x="19" y="69" width="420" height="32" style="transform:scaleX(0)"/>
<rect class="blk" x="20" y="116" width="10" height="10" rx="2"/><text class="mut" x="36" y="125" font-size="13">reused from cache</text>
<rect class="blk" x="190" y="116" width="10" height="10" rx="2"/><rect class="accs" x="190" y="116" width="10" height="10" rx="2"/><text class="mut" x="206" y="125" font-size="13">recomputed</text>
<rect class="acc" x="310" y="116" width="10" height="10" rx="2"/><text class="mut" x="326" y="125" font-size="13">changed</text>
<text class="mut" x="20" y="156" font-size="13">time to first token</text>
<rect class="trk" x="20" y="164" width="418" height="16" rx="3"/>
<rect id="ttft" class="a l acc" x="20" y="164" width="418" height="16" rx="3" style="transform:scaleX(0.0333)"/>
<text class="mut" x="20" y="244" font-size="13">Reuse stops at the first changed token.</text>
</svg>
