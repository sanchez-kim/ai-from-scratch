<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330" role="img">
<title>Length of top-10 paragraphs against b</title>
<desc>Mean length in tokens of the paragraphs in the top 10, k1 = 1.5, 10,000 paragraphs, 500 queries per set. lexical: b 0 88.2, b 0.25 73.0, b 0.5 63.2, b 0.75 56.5, b 1 51.6; paraphrase: b 0 113.4, b 0.25 90.0, b 0.5 73.3, b 0.75 61.1, b 1 52.0. Corpus average 56.4 tokens.</desc>
<style>
  .bg{fill:#fcfcfb} .ink{fill:#0b0b0b} .sec{fill:#52514e} .mut{fill:#898781}
