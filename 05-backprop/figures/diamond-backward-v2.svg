<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 424" width="460" height="424" role="img">
<title>Backward pass on a diamond graph, correct and with the assignment bug</title>
<desc>L = a*3 + a*5 with a = 2. Gradients flow from L back to a along two paths: blue through a*3, orange through a*5. L gets grad 1, both products get grad 1, then the orange path sends 5 to a and the blue path sends 3. With grad += a ends at 8. With grad = the 3 overwrites the 5, the orange path fades, and a ends at 3.</desc>
