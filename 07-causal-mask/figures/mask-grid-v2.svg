<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 576" width="460" height="576" role="img">
<title>Attention with and without a causal mask</title>
<desc>Two 6 by 6 attention grids for the characters Bennet, layer 1, head 4. In the causal model every cell above the diagonal is -inf and gets weight 0. In the model trained without a mask the same head puts weight 1.00, 1.00, 0.99, 1.00, 0.39 on the next character. Validation loss as trained after 5000 steps: causal 1.24, no mask 0.025 nats. No-mask loss at a position that sees only its past: 1.57 nats.</desc>
