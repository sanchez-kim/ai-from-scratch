<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 352" width="460" height="352" role="img"><title>How BPE merges build tokens</title><desc>Part 1: the word lowest starts as 6 bytes. Four merges learned from a tiny English text run one by one: e+s, es+t, l+o, lo+w, ending as low + est, although lowest never appears in that text. Part 2: the Korean word 한국어 is 9 UTF-8 bytes. With merges learned from English only it stays 9 raw-byte tokens. With merges learned from English and Korean, the syllables become single tokens after merges 67, 109 and 785, ending as 3 tokens. Same word: cl100k_base 4 tokens, o200k_base 2. Tokens merged from English text are blue, tokens merged from Korean text are orange, raw single bytes are outlined boxes.</desc><style>
  .bg{fill:#fcfcfb} .ink{fill:#0b0b0b} .mut{fill:#52514e} .tw{fill:#ffffff;font-weight:600}
  .byt{fill:#fcfcfb;stroke:#898781;stroke-width:1}
  .en{fill:#2a78d6} .ko{fill:#eb6834}
  .cur{stroke:#0b0b0b;stroke-width:2}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .a{animation-duration:16.0s;animation-iteration-count:infinite;animation-timing-function:linear}
  @keyframes a0 { 0% {opacity:1} 9.38% {opacity:1} 11.25% {opacity:0} 100% {opacity:0} } #a0{animation-name:a0} @keyframes a1 { 0% {opacity:0} 7.5% {opacity:0} 9.38% {opacity:1} 18.75% {opacity:1} 20.62% {opacity:0} 100% {opacity:0} } #a1{animation-name:a1} @keyframes a2 { 0% {opacity:0} 16.88% {opacity:0} 18.75% {opacity:1} 28.12% {opacity:1} 30.0% {opacity:0} 100% {opacity:0} } #a2{animation-name:a2} @keyframes a3 { 0% {opacity:0} 26.25% {opacity:0} 28.12% {opacity:1} 37.5% {opacity:1} 39.38% {opacity:0} 100% {opacity:0} } #a3{animation-name:a3} @keyframes a4 { 0% {opacity:0} 35.62% {opacity:0} 37.5% {opacity:1} 100% {opacity:1} } #a4{animation-name:a4} @keyframes a_note { 0% {opacity:0} 35.62% {opacity:0} 37.5% {opacity:1} 100% {opacity:1} } #a_note{animation-name:a_note} @keyframes k0 { 0% {opacity:0} 41.88% {opacity:0} 43.75% {opacity:1} 56.25% {opacity:1} 58.13% {opacity:0} 100% {opacity:0} } #k0{animation-name:k0} @keyframes k1 { 0% {opacity:0} 54.37% {opacity:0} 56.25% {opacity:1} 68.75% {opacity:1} 70.62% {opacity:0} 100% {opacity:0} } #k1{animation-name:k1} @keyframes k2 { 0% {opacity:0} 66.88% {opacity:0} 68.75% {opacity:1} 81.25% {opacity:1} 83.12% {opacity:0} 100% {opacity:0} } #k2{animation-name:k2} @keyframes k3 { 0% {opacity:0} 79.38% {opacity:0} 81.25% {opacity:1} 100% {opacity:1} } #k3{animation-name:k3} @keyframes b { 0% {opacity:0} 41.88% {opacity:0} 43.75% {opacity:1} 100% {opacity:1} } #b{animation-name:b}
  @media (prefers-color-scheme: dark) {
    .bg{fill:#1a1a19} .ink{fill:#f0efec} .mut{fill:#c3c2b7}
    .byt{fill:#1a1a19;stroke:#898781} .en{fill:#3987e5} .ko{fill:#d95926}
    .cur{stroke:#f0efec}
  }
  @media (prefers-reduced-motion: reduce) { .a{animation:none} }
</style><rect class="bg" width="460" height="352"/><text class="ink" x="20" y="24" font-size="15" font-weight="600" opacity="1">1 · Merges learned from a tiny English text</text><g id="a0" class="a" opacity="0"><rect class="byt" x="20" y="36" width="40" height="34" rx="3"/><text class="ink" x="40.0" y="58.0" text-anchor="middle" font-size="14">l</text><rect class="byt" x="64" y="36" width="40" height="34" rx="3"/><text class="ink" x="84.0" y="58.0" text-anchor="middle" font-size="14">o</text><rect class="byt" x="108" y="36" width="40" height="34" rx="3"/><text class="ink" x="128.0" y="58.0" text-anchor="middle" font-size="14">w</text><rect class="byt" x="152" y="36" width="40" height="34" rx="3"/><text class="ink" x="172.0" y="58.0" text-anchor="middle" font-size="14">e</text><rect class="byt" x="196" y="36" width="40" height="34" rx="3"/><text class="ink" x="216.0" y="58.0" text-anchor="middle" font-size="14">s</text><rect class="byt" x="240" y="36" width="40" height="34" rx="3"/><text class="ink" x="260.0" y="58.0" text-anchor="middle" font-size="14">t</text><text class="ink" x="20" y="94" font-size="14" font-weight="400" opacity="1">start: 6 bytes, 6 tokens</text></g><g id="a1" class="a" opacity="0"><rect class="byt" x="20" y="36" width="40" height="34" rx="3"/><text class="ink" x="40.0" y="58.0" text-anchor="middle" font-size="14">l</text><rect class="byt" x="64" y="36" width="40" height="34" rx="3"/><text class="ink" x="84.0" y="58.0" text-anchor="middle" font-size="14">o</text><rect class="byt" x="108" y="36" width="40" height="34" rx="3"/><text class="ink" x="128.0" y="58.0" text-anchor="middle" font-size="14">w</text><rect class="en cur" x="152" y="36" width="84" height="34" rx="3"/><text class="tw" x="194.0" y="58.0" text-anchor="middle" font-size="14">es</text><rect class="byt" x="240" y="36" width="40" height="34" rx="3"/><text class="ink" x="260.0" y="58.0" text-anchor="middle" font-size="14">t</text><text class="ink" x="20" y="94" font-size="14" font-weight="400" opacity="1">merge 1: e + s → es</text></g><g id="a2" class="a" opacity="0"><rect class="byt" x="20" y="36" width="40" height="34" rx="3"/><text class="ink" x="40.0" y="58.0" text-anchor="middle" font-size="14">l</text><rect class="byt" x="64" y="36" width="40" height="34" rx="3"/><text class="ink" x="84.0" y="58.0" text-anchor="middle" font-size="14">o</text><rect class="byt" x="108" y="36" width="40" height="34" rx="3"/><text class="ink" x="128.0" y="58.0" text-anchor="middle" font-size="14">w</text><rect class="en cur" x="152" y="36" width="128" height="34" rx="3"/><text class="tw" x="216.0" y="58.0" text-anchor="middle" font-size="14">est</text><text class="ink" x="20" y="94" font-size="14" font-weight="400" opacity="1">merge 2: es + t → est</text></g><g id="a3" class="a" opacity="0"><rect class="en cur" x="20" y="36" width="84" height="34" rx="3"/><text class="tw" x="62.0" y="58.0" text-anchor="middle" font-size="14">lo</text><rect class="byt" x="108" y="36" width="40" height="34" rx="3"/><text class="ink" x="128.0" y="58.0" text-anchor="middle" font-size="14">w</text><rect class="en" x="152" y="36" width="128" height="34" rx="3"/><text class="tw" x="216.0" y="58.0" text-anchor="middle" font-size="14">est</text><text class="ink" x="20" y="94" font-size="14" font-weight="400" opacity="1">merge 3: l + o → lo</text></g><g id="a4" class="a" opacity="1"><rect class="en cur" x="20" y="36" width="128" height="34" rx="3"/><text class="tw" x="84.0" y="58.0" text-anchor="middle" font-size="14">low</text><rect class="en" x="152" y="36" width="128" height="34" rx="3"/><text class="tw" x="216.0" y="58.0" text-anchor="middle" font-size="14">est</text><text class="ink" x="20" y="94" font-size="14" font-weight="400" opacity="1">merge 4: lo + w → low</text></g><text id="a_note" class="a mut" x="20" y="116" font-size="13" font-weight="400" opacity="1">"lowest" is not in the text. It still gets low + est.</text><g id="b" class="a"><text class="ink" x="20" y="152" font-size="15" font-weight="600" opacity="1">2 · 한국어 is 9 bytes in UTF-8</text><text class="mut" x="20" y="176" font-size="13" font-weight="400" opacity="1">Merges from English only: 9 tokens</text><rect class="byt" x="20" y="184" width="42" height="30" rx="3"/><text class="ink" x="41.0" y="204.0" text-anchor="middle" font-size="14">ED</text><rect class="byt" x="66" y="184" width="42" height="30" rx="3"/><text class="ink" x="87.0" y="204.0" text-anchor="middle" font-size="14">95</text><rect class="byt" x="112" y="184" width="42" height="30" rx="3"/><text class="ink" x="133.0" y="204.0" text-anchor="middle" font-size="14">9C</text><rect class="byt" x="158" y="184" width="42" height="30" rx="3"/><text class="ink" x="179.0" y="204.0" text-anchor="middle" font-size="14">EA</text><rect class="byt" x="204" y="184" width="42" height="30" rx="3"/><text class="ink" x="225.0" y="204.0" text-anchor="middle" font-size="14">B5</text><rect class="byt" x="250" y="184" width="42" height="30" rx="3"/><text class="ink" x="271.0" y="204.0" text-anchor="middle" font-size="14">AD</text><rect class="byt" x="296" y="184" width="42" height="30" rx="3"/><text class="ink" x="317.0" y="204.0" text-anchor="middle" font-size="14">EC</text><rect class="byt" x="342" y="184" width="42" height="30" rx="3"/><text class="ink" x="363.0" y="204.0" text-anchor="middle" font-size="14">96</text><rect class="byt" x="388" y="184" width="42" height="30" rx="3"/><text class="ink" x="409.0" y="204.0" text-anchor="middle" font-size="14">B4</text><g id="k0" class="a" opacity="0"><text class="mut" x="20" y="238" font-size="13" font-weight="400" opacity="1">English + Korean, start: 9 tokens</text><rect class="byt" x="20" y="246" width="42" height="30" rx="3"/><text class="ink" x="41.0" y="266" text-anchor="middle" font-size="14">ED</text><rect class="byt" x="66" y="246" width="42" height="30" rx="3"/><text class="ink" x="87.0" y="266" text-anchor="middle" font-size="14">95</text><rect class="byt" x="112" y="246" width="42" height="30" rx="3"/><text class="ink" x="133.0" y="266" text-anchor="middle" font-size="14">9C</text><rect class="byt" x="158" y="246" width="42" height="30" rx="3"/><text class="ink" x="179.0" y="266" text-anchor="middle" font-size="14">EA</text><rect class="byt" x="204" y="246" width="42" height="30" rx="3"/><text class="ink" x="225.0" y="266" text-anchor="middle" font-size="14">B5</text><rect class="byt" x="250" y="246" width="42" height="30" rx="3"/><text class="ink" x="271.0" y="266" text-anchor="middle" font-size="14">AD</text><rect class="byt" x="296" y="246" width="42" height="30" rx="3"/><text class="ink" x="317.0" y="266" text-anchor="middle" font-size="14">EC</text><rect class="byt" x="342" y="246" width="42" height="30" rx="3"/><text class="ink" x="363.0" y="266" text-anchor="middle" font-size="14">96</text><rect class="byt" x="388" y="246" width="42" height="30" rx="3"/><text class="ink" x="409.0" y="266" text-anchor="middle" font-size="14">B4</text></g><g id="k1" class="a" opacity="0"><text class="mut" x="20" y="238" font-size="13" font-weight="400" opacity="1">English + Korean, after 67 merges: 7 tokens</text><rect class="ko" x="20" y="246" width="134" height="30" rx="3"/><text class="tw" x="87.0" y="266" text-anchor="middle" font-size="14">한 ED 95 9C</text><rect class="byt" x="158" y="246" width="42" height="30" rx="3"/><text class="ink" x="179.0" y="266" text-anchor="middle" font-size="14">EA</text><rect class="byt" x="204" y="246" width="42" height="30" rx="3"/><text class="ink" x="225.0" y="266" text-anchor="middle" font-size="14">B5</text><rect class="byt" x="250" y="246" width="42" height="30" rx="3"/><text class="ink" x="271.0" y="266" text-anchor="middle" font-size="14">AD</text><rect class="byt" x="296" y="246" width="42" height="30" rx="3"/><text class="ink" x="317.0" y="266" text-anchor="middle" font-size="14">EC</text><rect class="byt" x="342" y="246" width="42" height="30" rx="3"/><text class="ink" x="363.0" y="266" text-anchor="middle" font-size="14">96</text><rect class="byt" x="388" y="246" width="42" height="30" rx="3"/><text class="ink" x="409.0" y="266" text-anchor="middle" font-size="14">B4</text></g><g id="k2" class="a" opacity="0"><text class="mut" x="20" y="238" font-size="13" font-weight="400" opacity="1">English + Korean, after 109 merges: 5 tokens</text><rect class="ko" x="20" y="246" width="134" height="30" rx="3"/><text class="tw" x="87.0" y="266" text-anchor="middle" font-size="14">한 ED 95 9C</text><rect class="byt" x="158" y="246" width="42" height="30" rx="3"/><text class="ink" x="179.0" y="266" text-anchor="middle" font-size="14">EA</text><rect class="byt" x="204" y="246" width="42" height="30" rx="3"/><text class="ink" x="225.0" y="266" text-anchor="middle" font-size="14">B5</text><rect class="byt" x="250" y="246" width="42" height="30" rx="3"/><text class="ink" x="271.0" y="266" text-anchor="middle" font-size="14">AD</text><rect class="ko" x="296" y="246" width="134" height="30" rx="3"/><text class="tw" x="363.0" y="266" text-anchor="middle" font-size="14">어 EC 96 B4</text></g><g id="k3" class="a" opacity="1"><text class="mut" x="20" y="238" font-size="13" font-weight="400" opacity="1">English + Korean, after 785 merges: 3 tokens</text><rect class="ko" x="20" y="246" width="134" height="30" rx="3"/><text class="tw" x="87.0" y="266" text-anchor="middle" font-size="14">한 ED 95 9C</text><rect class="ko" x="158" y="246" width="134" height="30" rx="3"/><text class="tw" x="225.0" y="266" text-anchor="middle" font-size="14">국 EA B5 AD</text><rect class="ko" x="296" y="246" width="134" height="30" rx="3"/><text class="tw" x="363.0" y="266" text-anchor="middle" font-size="14">어 EC 96 B4</text></g><text class="mut" x="20" y="302" font-size="13" font-weight="400" opacity="1">Same word: cl100k_base 4 tokens, o200k_base 2.</text><text class="mut" x="20" y="320" font-size="13" font-weight="400" opacity="1">Ours: 8,000 merges each, ~540 KB of Wikipedia.</text></g><rect class="en" x="20" y="331" width="14" height="14" rx="2"/><text class="mut" x="40" y="343" font-size="13" font-weight="400" opacity="1">from English</text><rect class="ko" x="160" y="331" width="14" height="14" rx="2"/><text class="mut" x="180" y="343" font-size="13" font-weight="400" opacity="1">from Korean</text><rect class="byt" x="292" y="331.5" width="13" height="13" rx="2"/><text class="mut" x="312" y="343" font-size="13" font-weight="400" opacity="1">raw byte</text></svg>
