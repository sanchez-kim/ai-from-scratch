<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320" role="img">
<title>Dev loss by training step for three init scales</title>
<desc>Dev loss in nats, measured every 100 steps, SGD lr 0.1, batch 32, same seeds. Line colours: 1/sqrt(fan_in) blue, std 1.0 orange, std 0.01 aqua. std 1.0: 14.16 at step 0, 2.482 at step 4000; std 0.01: 3.30 at step 0, 2.348 at step 4000; 1/√fan_in: 3.46 at step 0, 2.324 at step 4000. A dashed line marks ln 27 = 3.30, the loss of a uniform guess.</desc>
