<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" width="460" height="560" role="img">
<title>Hidden activations at init by scale, and naive vs stable loss at lr 100</title>
<desc>Top: histogram of hidden tanh values at init over the dev set, 20 bins from -1 to 1, one colour per init scale (std 1/sqrt(fan_in) blue, std 1.0 orange, std 0.01 aqua). Shaded bands mark the outer bins beyond plus or minus 0.9. std 1.0: 56.6% of values above 0.99 in size, loss at init 14.16; std 0.01: 0.0% of values above 0.99 in size, loss at init 3.30; std 1/√fan_in: 0.6% of values above 0.99 in size, loss at init 3.46. Bottom: training loss for steps 1 to 20 at lr 100. The stable loss (blue) stays finite. The naive loss in numpy float64 (orange) is inf at step 4 and NaN from step 6.</desc>
<style>
  .bg{fill:#fcfcfb} .ink{fill:#0b0b0b} .sec{fill:#52514e} .mut{fill:#898781}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a}
  .band{fill:#e1e0d9;opacity:.55} .base{stroke:#c3c2b7;stroke-width:1} .grid{stroke:#e1e0d9;stroke-width:1}
  .ln{fill:none;stroke-width:2.5;stroke-dasharray:1;stroke-linejoin:round} .l1{stroke:#2a78d6} .l2{stroke:#eb6834;stroke-width:3.5}
  .mark{stroke:#eb6834;stroke-width:1;stroke-dasharray:3 3} .dot{stroke:#fcfcfb;stroke-width:2}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  .h{font-size:15px;font-weight:600}
  .a{animation-duration:9.0s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
  #p0{animation-name:p0} #p1{animation-name:p1} #p2{animation-name:p2} #sl,#nl{animation-name:draw} #mi,#nlab{animation-name:r10} #mn{animation-name:r21}
  @keyframes p0 { 0.00% { opacity:1 } 25.00% { opacity:1 } 33.33% { opacity:0 } 91.67% { opacity:0 } 100.00% { opacity:1 } } @keyframes p1 { 0.00% { opacity:0 } 25.00% { opacity:0 } 33.33% { opacity:1 } 58.33% { opacity:1 } 66.67% { opacity:0 } 100.00% { opacity:0 } } @keyframes p2 { 0.00% { opacity:0 } 58.33% { opacity:0 } 66.67% { opacity:1 } 91.67% { opacity:1 } 100.00% { opacity:0 } } @keyframes draw { 0.00% { stroke-dashoffset:1 } 70.00% { stroke-dashoffset:0 } 100.00% { stroke-dashoffset:0 } } @keyframes r10 { 0.00% { opacity:0 } 10.00% { opacity:0 } 13.00% { opacity:1 } 100.00% { opacity:1 } } @keyframes r21 { 0.00% { opacity:0 } 21.00% { opacity:0 } 24.00% { opacity:1 } 100.00% { opacity:1 } }
  @media (prefers-color-scheme: dark) {
    .bg{fill:#1a1a19} .ink{fill:#f0efec} .sec{fill:#c3c2b7} .mut{fill:#898781}
    .s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70}
    .band{fill:#2c2c2a;opacity:1} .base{stroke:#383835} .grid{stroke:#2c2c2a}
    .l1{stroke:#3987e5} .l2{stroke:#d95926} .mark{stroke:#d95926} .dot{stroke:#1a1a19}
  }
  @media (prefers-reduced-motion: reduce) { .a{animation:none} }
</style>
<rect class="bg" width="460" height="560"/>
<text class="mut" x="22" y="26">hidden tanh values at init (dev set)</text>
<rect class="band" x="22" y="78" width="20.8" height="160"/>
<rect class="band" x="417.2" y="78" width="20.8" height="160"/>
<text class="sec" x="438" y="72" text-anchor="end">shaded: beyond ±0.9</text>
