<rect x="231.0" y="113.9" width="18.8" height="124.1"/><rect x="251.8" y="234.8" width="18.8" height="3.2"/><rect x="272.6" y="238.0" width="18.8" height="0.0"/><rect x="293.4" y="238.0" width="18.8" height="0.0"/><rect x="314.2" y="238.0" width="18.8" height="0.0"/><rect x="335.0" y="238.0" width="18.8" height="0.0"/><rect x="355.8" y="238.0" width="18.8" height="0.0"/><rect x="376.6" y="238.0" width="18.8" height="0.0"/><rect x="397.4" y="238.0" width="18.8" height="0.0"/><rect x="418.2" y="238.0" width="18.8" height="0.0"/></g><text class="ink" x="22" y="278">|h| &gt; 0.99: 0.0% · loss at init 3.30</text></g><g id="p2" class="a" opacity="1"><rect class="s1" x="22" y="42" width="14" height="14" rx="2"/><text class="ink h" x="44" y="54">init std 1/√fan_in</text><g class="s1"><rect x="23.0" y="219.2" width="18.8" height="18.8"/><rect x="43.8" y="218.4" width="18.8" height="19.6"/><rect x="64.6" y="222.0" width="18.8" height="16.0"/><rect x="85.4" y="222.3" width="18.8" height="15.7"/><rect x="106.2" y="224.4" width="18.8" height="13.6"/><rect x="127.0" y="225.1" width="18.8" height="12.9"/><rect x="147.8" y="225.7" width="18.8" height="12.3"/><rect x="168.6" y="224.4" width="18.8" height="13.6"/><rect x="189.4" y="225.9" width="18.8" height="12.1"/><rect x="210.2" y="227.2" width="18.8" height="10.8"/><rect x="231.0" y="226.1" width="18.8" height="11.9"/><rect x="251.8" y="227.8" width="18.8" height="10.2"/><rect x="272.6" y="225.0" width="18.8" height="13.0"/><rect x="293.4" y="225.9" width="18.8" height="12.1"/><rect x="314.2" y="227.1" width="18.8" height="10.9"/><rect x="335.0" y="224.9" width="18.8" height="13.1"/><rect x="355.8" y="224.5" width="18.8" height="13.5"/><rect x="376.6" y="223.9" width="18.8" height="14.1"/><rect x="397.4" y="224.9" width="18.8" height="13.1"/><rect x="418.2" y="222.6" width="18.8" height="15.4"/></g><text class="ink" x="22" y="278">|h| &gt; 0.99: 0.6% · loss at init 3.46</text></g>
<line class="base" x1="22" x2="438" y1="238.5" y2="238.5"/>
