<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img">
<title>Two ranked lists merged by reciprocal rank fusion</title>
<desc>Real query from the paraphrase set: What makes a distinct individual within the divine group? BM25 top 5 (blue): 1 Elliot Richardson, 2 Computer security, 3 Crew, 4 States' rights, 5 Sabellianism. Embedding top 5 (orange): 1 God, 2 God, 3 Sabellianism, 4 Mysticism, 5 Alter ego. RRF k = 60 top 5 (aqua), each with a blue BM25 term and an orange embedding term: 1 Sabellianism 0.0313, 2 Mysticism 0.0236, 3 Crew 0.0222, 4 Judaism 0.0203, 5 Sign of the cross 0.0192. The answer paragraph (Sabellianism) is #5 in BM25 and #3 in embeddings, and #1 after RRF.</desc>
<style>
  .bg{fill:#fcfcfb} .ink{fill:#0b0b0b} .sec{fill:#52514e}
  .bm25{fill:#2a78d6} .emb{fill:#eb6834} .fus{fill:#1baf7a}
  .none{fill:none;stroke:#c3c2b7;stroke-width:1.5}
  .gold{fill:none;stroke:#eda100;stroke-width:2}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  .b{font-weight:600} .h{font-size:14px;font-weight:600}
  .a{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease-out}
  #f0{animation-name:f0} #f1{animation-name:f1} #f2{animation-name:f2} #f3{animation-name:f3} #f4{animation-name:f4} #ft{animation-name:ft}
  @keyframes f0 { 0% { opacity:0;transform:translateX(-24px) } 22% { opacity:0;transform:translateX(-24px) } 28% { opacity:1;transform:translateX(0) } 96% { opacity:1;transform:translateX(0) } 100% { opacity:0;transform:translateX(0) } } @keyframes f1 { 0% { opacity:0;transform:translateX(-24px) } 30% { opacity:0;transform:translateX(-24px) } 36% { opacity:1;transform:translateX(0) } 96% { opacity:1;transform:translateX(0) } 100% { opacity:0;transform:translateX(0) } } @keyframes f2 { 0% { opacity:0;transform:translateX(-24px) } 38% { opacity:0;transform:translateX(-24px) } 44% { opacity:1;transform:translateX(0) } 96% { opacity:1;transform:translateX(0) } 100% { opacity:0;transform:translateX(0) } } @keyframes f3 { 0% { opacity:0;transform:translateX(-24px) } 46% { opacity:0;transform:translateX(-24px) } 52% { opacity:1;transform:translateX(0) } 96% { opacity:1;transform:translateX(0) } 100% { opacity:0;transform:translateX(0) } } @keyframes f4 { 0% { opacity:0;transform:translateX(-24px) } 54% { opacity:0;transform:translateX(-24px) } 60% { opacity:1;transform:translateX(0) } 96% { opacity:1;transform:translateX(0) } 100% { opacity:0;transform:translateX(0) } } @keyframes ft { 0% { opacity:0 } 66% { opacity:0 } 72% { opacity:1 } 96% { opacity:1 } 100% { opacity:0 } }
  @media (prefers-color-scheme: dark) {
    .bg{fill:#1a1a19} .ink{fill:#f0efec} .sec{fill:#c3c2b7}
    .bm25{fill:#3987e5} .emb{fill:#d95926} .fus{fill:#199e70}
    .none{stroke:#383835} .gold{stroke:#c98500}
  }
  @media (prefers-reduced-motion: reduce) { .a{animation:none} }
</style>
<rect class="bg" width="480" height="340"/>
<text class="ink h" x="16" y="24">One real query, two top-5 lists, one merge</text>
<text class="sec" x="16" y="42">each list gives a paragraph 1/(60 + rank)</text>
<rect class="bm25" x="8" y="55" width="12" height="12"/><text class="ink b" x="26" y="66">BM25</text><rect class="emb" x="142" y="55" width="12" height="12"/><text class="ink b" x="160" y="66">embedding</text><rect class="fus" x="276" y="55" width="12" height="12"/><text class="ink b" x="294" y="66">RRF, k = 60</text><g><rect class="bm25" x="8" y="83" width="4" height="16"/><text class="ink" x="20" y="96">1 Elliot Rich…</text></g><g><rect class="bm25" x="8" y="117" width="4" height="16"/><text class="ink" x="20" y="130">2 Computer se…</text></g><g><rect class="bm25" x="8" y="151" width="4" height="16"/><text class="ink" x="20" y="164">3 Crew</text></g><g><rect class="bm25" x="8" y="185" width="4" height="16"/><text class="ink" x="20" y="198">4 States' rig…</text></g><g><rect class="gold" x="15" y="216" width="121" height="22" rx="3"/><rect class="bm25" x="8" y="219" width="4" height="16"/><text class="ink" x="20" y="232">5 Sabellianism*</text></g><g><rect class="emb" x="142" y="83" width="4" height="16"/><text class="ink" x="154" y="96">1 God</text></g><g><rect class="emb" x="142" y="117" width="4" height="16"/><text class="ink" x="154" y="130">2 God</text></g><g><rect class="gold" x="149" y="148" width="121" height="22" rx="3"/><rect class="emb" x="142" y="151" width="4" height="16"/><text class="ink" x="154" y="164">3 Sabellianism*</text></g><g><rect class="emb" x="142" y="185" width="4" height="16"/><text class="ink" x="154" y="198">4 Mysticism</text></g><g><rect class="emb" x="142" y="219" width="4" height="16"/><text class="ink" x="154" y="232">5 Alter ego</text></g><g id="f0" class="a"><rect class="gold" x="283" y="80" width="188" height="22" rx="3"/><rect class="fus" x="276" y="83" width="4" height="16"/><text class="ink" x="288" y="96">1 Sabellianism*</text><rect class="bm25" x="288.0" y="102" width="10" height="10"/><text class="sec" x="301.0" y="112">1/65</text><text class="sec" x="336.6" y="112">+</text><rect class="emb" x="348.5" y="102" width="10" height="10"/><text class="sec" x="361.5" y="112">1/63</text><text class="sec" x="397.1" y="112">= .0313</text></g><g id="f1" class="a"><rect class="fus" x="276" y="117" width="4" height="16"/><text class="ink" x="288" y="130">2 Mysticism</text><rect class="bm25" x="288.0" y="136" width="10" height="10"/><text class="sec" x="301.0" y="146">1/126</text><text class="sec" x="344.5" y="146">+</text><rect class="emb" x="356.4" y="136" width="10" height="10"/><text class="sec" x="369.4" y="146">1/64</text><text class="sec" x="405.0" y="146">= .0236</text></g><g id="f2" class="a"><rect class="fus" x="276" y="151" width="4" height="16"/><text class="ink" x="288" y="164">3 Crew</text><rect class="bm25" x="288.0" y="170" width="10" height="10"/><text class="sec" x="301.0" y="180">1/63</text><text class="sec" x="336.6" y="180">+</text><rect class="emb" x="348.5" y="170" width="10" height="10"/><text class="sec" x="361.5" y="180">1/159</text><text class="sec" x="405.0" y="180">= .0222</text></g><g id="f3" class="a"><rect class="fus" x="276" y="185" width="4" height="16"/><text class="ink" x="288" y="198">4 Judaism</text><rect class="bm25" x="288.0" y="204" width="10" height="10"/><text class="sec" x="301.0" y="214">1/143</text><text class="sec" x="344.5" y="214">+</text><rect class="emb" x="356.4" y="204" width="10" height="10"/><text class="sec" x="369.4" y="214">1/75</text><text class="sec" x="405.0" y="214">= .0203</text></g><g id="f4" class="a"><rect class="fus" x="276" y="219" width="4" height="16"/><text class="ink" x="288" y="232">5 Sign of the…</text><rect class="bm25" x="288.0" y="238" width="10" height="10"/><text class="sec" x="301.0" y="248">1/99</text><text class="sec" x="336.6" y="248">+</text><rect class="emb" x="348.5" y="238" width="10" height="10"/><text class="sec" x="361.5" y="248">1/110</text><text class="sec" x="405.0" y="248">= .0192</text></g><g id="ft" class="a"><rect class="gold" x="16" y="297" width="12" height="12" rx="2"/><text class="ink" x="34" y="308">* answer: BM25 #5, embedding #3</text><text class="ink b" x="16" y="328">RRF: 1/65 + 1/63 = 0.0313 → #1</text></g>
</svg>
